name = "hex-gram-schmidt-theory"
defaultTargets = ["HexGramSchmidtTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBareissTheory"
git = "https://github.com/leanprover/hex-bareiss-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexGramSchmidt"
git = "https://github.com/leanprover/hex-gram-schmidt.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexGramSchmidtTheory"
